name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 16.0
            runner: macos-15
            xcode: "16.0"
            release: false
          - name: Xcode 26.4.1
            runner: macos-26
            xcode: "26.4.1"
            release: true

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.xcode }}-swiftpm-

      - name: Run debug tests
        run: swift test -c debug

      - name: Build public consumer fixture
        run: swift build --package-path Fixtures/IsolationConsumer --scratch-path .build/consumer-fixture

      - name: Run release tests
        if: matrix.release
        run: swift test -c release

  advertised-platforms:
    name: Build ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14
            key: macos
            sdk: macosx
            triple: arm64-apple-macosx14.0
          - name: iOS 17
            key: ios
            sdk: iphonesimulator
            triple: arm64-apple-ios17.0-simulator
          - name: tvOS 17
            key: tvos
            sdk: appletvsimulator
            triple: arm64-apple-tvos17.0-simulator
          - name: watchOS 10
            key: watchos
            sdk: watchsimulator
            triple: arm64-apple-watchos10.0-simulator
          - name: Mac Catalyst 17
            key: catalyst
            sdk: macosx
            triple: arm64-apple-ios17.0-macabi
          - name: visionOS 1
            key: visionos
            sdk: xrsimulator
            triple: arm64-apple-xros1.0-simulator

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-26.4.1-${{ matrix.key }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.4.1-${{ matrix.key }}-swiftpm-

      - name: Build library target
        shell: bash
        run: |
          sdk_path="$(xcrun --sdk '${{ matrix.sdk }}' --show-sdk-path)"
          swift build \
            --target ObservationTracking \
            --triple '${{ matrix.triple }}' \
            --sdk "$sdk_path" \
            --scratch-path '.build/platform-${{ matrix.key }}'

  example:
    name: Build iOS example
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build example
        run: >
          xcodebuild
          -project Example/Example.xcodeproj
          -scheme Example
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
